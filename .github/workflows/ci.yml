name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated code is current
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: flutter analyze
      - name: Run memory-safe unit and widget tests
        run: dart run tool/run_flutter_tests.dart

  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libayatana-appindicator3-dev libgtk-3-dev \
            libsecret-1-dev ninja-build pkg-config xauth xvfb
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Run mocked application workflow
        run: >-
          xvfb-run -a flutter test
          integration_test/end_to_end_mocked_workflow_test.dart
          -d linux

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires `
            Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            Microsoft.VisualStudio.Component.VC.ATL `
            -property installationPath
          if (-not $visualStudio) {
            throw 'Visual Studio C++ and ATL components are required.'
          }
          flutter doctor -v
      - run: flutter pub get
      - name: Build unpackaged Windows preview
        run: >-
          flutter build windows --release
          --dart-define=APP_ENV=production
          --dart-define=BACKEND_BASE_URL=https://api.example.org
      - name: Verify complete Windows Release directory
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/windows/x64/runner/Release')) {
            throw 'Windows Release directory was not produced.'
          }
