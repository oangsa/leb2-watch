name: leb2_watch
description: "Local-first assignment monitoring for LEB2."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  dio: ^5.10.0
  drift: ^2.34.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  freezed: 3.2.6-dev.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  riverpod_lint: 3.1.4

flutter:
  uses-material-design: true
